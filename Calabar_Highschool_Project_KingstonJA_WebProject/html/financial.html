<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Ledger | Admin</title>
    <link rel="stylesheet" href="../css/C_Styles.css">
    <link rel="icon" type="image/png" href="../assets/Calabar_High_School_Crest.png">
    <script src="../javascript/logic.js" defer></script>     
  </head>
  <body>
    <header class="banner">
      <h1>Financial Ledger</h1>
    </header>
    <div class="Nav1">
      <nav aria-label="Main navigation">
        <a href="admin_dashboard.html" aria-current="page">Administrator</a>
        <a href="register.html">Registration</a>
        <a href="financial.html">Financial Ledger</a>
        <a href="index.html">Logout</a>
      </nav>
    </div>
    <main>
    <a class="teacher-brand">
      <img src="../assets/Calabar_Logo.png" alt="" class="nav-logo">
      <span>Calabar High School</span>
    </a>
        <section class="Nav container">
          <h3>Financial Ledger Form</h3>
          <form id = "financialform">
            <label for="feestudentid">Student ID</label>
            <input type="text" id="feestudentid" name="feestudentid" required>
            <label for="totalfee">Total fee</label>
            <input type="number" id="totalfee" name="totalfee" min="0" required>
            <label for="amountpaid">Amount paid</label>
            <input type="number" id="amountpaid" name="amountpaid" min="0" required>
            <label for="paymentstatus">Payment status</label>
            <select id="paymentstatus" name="paymentstatus">
              <option value="">Select status</option>
              <option value="paid">Paid</option>
              <option value="pending">Pending</option>
              <option value="outstanding">Outstanding</option>
            </select>
            <button type="submit">Submit payment</button>
          </form>
        </section>
        <section class="Nav container">
          <h3>Students Finance</h3>
          <div class="directory-table-wrapper">
            <table>
              <thead>
                <tr>
                  <th scope="col">Student ID</th>
                  <th scope="col">Student name</th>
                  <th scope="col">Total fee</th>
                  <th scope="col">Amount paid</th>
                  <th scope="col">Balance</th>
                  <th scope="col">Payment status</th>
                </tr>
              </thead>
              <tbody id="financetablebody"></tbody>
            </table>
          </div>
        </section>
    </main>
    <footer>
      <div class="container footer-inner">
        <span>&copy; Calabar High School</span>
        <span>The Utmost for the Highest</span>
      </div>
    </footer>
  </body>
</html>
