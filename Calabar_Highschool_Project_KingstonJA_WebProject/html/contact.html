<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Welcome to Calabar High School in Jamaica.">
        <title>Calabar High School- Contact Us</title>
        <link rel="stylesheet" href="../css/C_Styles.css"/>
        <link rel="icon" type="image/png" href="../assets/Calabar_High_School_Crest.png">
        <script src="../javascript/logic.js" defer></script>
    </head>
    <body>
        <div class="topbar">
            <div class="topbar-inner">
                <span>Calabar High School · 61 Red Hills Road · Kingston 2</span>
                <span>The Utmost for the Highest</span>
            </div>
        </div>
        <header>
        <nav class="topnav">
                <div class="nav-left">
                    <a class="logo-link" href="index.html">
                        <img src="../assets/Calabar_Logo.png" alt="Calabar High School Logo" class="nav-logo" />
                        <span>Calabar High School</span>
                    </a>
                </div>
                <div class="nav-right">
                    <a href="about.html">About</a>
                    <a class="active" href="contact.html">Contact</a>
                    <a href="login.html">Login</a>
                </div>
            </nav>
        </header>
        <main class="contact-container">
            <section class="contact-card">
                <h2>Contact Us</h2>
                <p class="contact-subtext">Enter your details below.</p>
                <form id="registration-form" novalidate>
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                        <span class="error-message" id="fullname-error" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="(876) 000-0000">
                        <span class="error-message" id="phone-error" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        <span class="error-message" id="email-error" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="message">Requests / Inquiries</label>
                        <textarea id="message" name="message" rows="5" placeholder="Enter your message or inquiry..." required></textarea>
                        <span class="error-message" id="message-error" aria-live="polite"></span>
                    </div>
                    <button type="submit" class="submit-btn">Submit</button>
                </form>
            </section>
        </main>
        <footer>
            <div class="container footer-inner">
                <span>&copy; Calabar High School</span>
                <span>The Utmost for the Highest</span>
            </div>
        </footer>
    </body>
</html>
